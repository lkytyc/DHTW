# ==========================================
# API Configuration
# ==========================================
# Leave blank to use OPENAI_API_BASE or fall back to the official OpenAI API URL.
OpenAI_API_Base: ""

# API key list. Each entry may be:
# - an environment variable name such as OPENAI_API_KEY
# - a literal API key string if you intentionally inject it elsewhere
# One key per line, each starting with "- ".
API_key_list:
  - "OPENAI_API_KEY"
  # Add more environment variable names above to increase concurrency.

# Legacy single-key configuration kept for compatibility.
API_key: ""

# ==========================================
# Other Configuration
# ==========================================
# Text chunk size per batch
chunk_size: 50

# Embedding model name
model_name_emb: "text-embedding-3-small"

# ==========================================
# Path Configuration
# ==========================================
# Data paths
seed_file_path: "../seed_data/"
all_file_path: "../all_data/"

# Prompt paths
ke_entity_extratction_prompt: "../prompt/kg_exploration/entity_extraction"
ke_relation_extratction_prompt: "../prompt/kg_exploration/relation_extraction"
ke_entity_labeling_prompt: "../prompt/kg_exploration/entity_type_label"
ke_entity_type_fusion_prompt: "../prompt/kg_exploration/entity_type_fusion"
ke_relation_type_fusion_prompt: "../prompt/kg_exploration/relation_type_fusion"
kc_entity_extratction_prompt: "../prompt/kg_construction/entity_extraction"
kc_relation_extratction_prompt: "../prompt/kg_construction/relation_extraction"
Suggestion_prompt: "../prompt/kg_exploration/ActionInsight"
Collaborative_Copilot_prompt: "../prompt/kg_exploration/CollaborativeCopilot"

# Output paths
save_ke_entity_path: "../output/kg_exploration/entity.csv"
save_suggestions_path: "../output/kg_exploration/suggestions.csv"
save_ke_relation_path: "../output/kg_exploration/relation.csv"
save_ke_entity_label_path: "../output/kg_exploration/entity_label.csv"
save_ke_entity_type_path: "../output/kg_exploration/entity_type.csv"
save_ke_relation_type_path: "../output/kg_exploration/relation_type.csv"
save_kc_entity_path: "../output/kg_construction/entity.csv"
save_kc_relation_path: "../output/kg_construction/relation.csv"
save_kr_schema_path: "../output/kg_refinement/schema.csv"
save_kg_schema_path: "../output/kg_exploration/kg_schema.csv"
save_collaborative_copilot_table_path: "../output/kg_exploration/copilot_suggestions.csv"
save_collaborative_copilot_report_path: "../output/kg_exploration/copilot_summary.txt"
